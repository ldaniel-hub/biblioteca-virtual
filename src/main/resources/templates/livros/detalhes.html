
<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Detalhes | Biblioteca Fácil</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="page-container" style="max-width: 900px">

    <a th:href="@{/livros}"
       class="text-secondary d-inline-block mb-4">
        ← Voltar para o acervo
    </a>

    <section class="surface-card overflow-hidden">

        <div class="p-4 p-md-5"
             style="background: linear-gradient(120deg, #edf1ff, #ffffff)">

            <div class="d-flex align-items-center gap-4">

                <div class="book-avatar"
                     style="width: 78px; height: 100px;
                            font-size: 34px; border-radius: 12px">
                    ▤
                </div>

                <div>
                    <span class="badge text-bg-primary mb-3">
                        Livro cadastrado
                    </span>

                    <h1 class="page-title mb-2"
                        th:text="${livro.titulo}">
                        Título do livro
                    </h1>

                    <p class="page-subtitle mb-0"
                       th:text="${'Por ' + livro.autor}">
                        Autor
                    </p>
                </div>

            </div>
        </div>

        <div class="p-4 p-md-5">

            <h2 class="h5 fw-bold mb-4">
                Informações do registro
            </h2>

            <div class="row g-4">

                <div class="col-12 col-md-6">
                    <div class="detail-label">Código</div>
                    <div class="detail-value"
                         th:text="${livro.id}"></div>
                </div>

                <div class="col-12 col-md-6">
                    <div class="detail-label">ISBN</div>
                    <div class="detail-value"
                         th:text="${livro.isbn}"></div>
                </div>

                <div class="col-12 col-md-6">
                    <div class="detail-label">Ano de publicação</div>
                    <div class="detail-value"
                         th:text="${livro.anoPublicacao}"></div>
                </div>

                <div class="col-12 col-md-6">
                    <div class="detail-label">Exemplares</div>
                    <div class="detail-value"
                         th:text="${livro.quantidade}"></div>
                </div>

            </div>

            <hr class="my-4"
                style="border-color: var(--border)">

            <div class="d-flex flex-wrap justify-content-end gap-2">

                <a th:href="@{/livros(busca=${busca})}"
                    class="btn btn-light border px-4 py-2">
                    Voltar
                </a>

                <a th:href="@{/livros/editar/{id}(id=${livro.id},busca=${busca})}"
                    class="btn btn-brand">
                    Editar livro
                </a>

            </div>

        </div>

    </section>

</main>

</body>
</html>
