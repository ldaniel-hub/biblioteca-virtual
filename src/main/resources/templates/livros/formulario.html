
<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Formulário | Biblioteca Fácil</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="page-container" style="max-width: 850px">

    <a th:href="@{/livros}"
       class="text-secondary d-inline-block mb-4">
        ← Voltar para o acervo
    </a>

    <div class="mb-4">
        <div class="text-primary fw-semibold small mb-2">
            GERENCIAMENTO DE ACERVO
        </div>

        <h1 class="page-title mb-2"
            th:text="${livro.id == null
                ? 'Cadastrar novo livro' : 'Editar livro'}">
            Cadastrar novo livro
        </h1>

        <p class="page-subtitle">
            Preencha as informações abaixo para manter
            seu catálogo atualizado.
        </p>
    </div>

    <section class="surface-card p-4 p-md-5">

        <form th:action="@{/livros/salvar}"
              th:object="${livro}"
              method="post">

            <input type="hidden" th:field="*{id}">
            <input type="hidden" name="busca" th:value="${busca}">

            <div class="mb-4">
                <h2 class="h5 fw-bold">Informações do livro</h2>

                <p class="text-secondary small">
                    Os campos marcados devem ser preenchidos corretamente.
                </p>
            </div>

            <div class="mb-4">
                <label class="form-label" for="titulo">
                    Título do livro
                </label>

                <input id="titulo"
                       type="text"
                       class="form-control"
                       th:field="*{titulo}"
                       th:errorclass="is-invalid"
                       placeholder="Ex.: Dom Casmurro"
                       maxlength="150">

                <div class="invalid-feedback"
                     th:errors="*{titulo}"></div>
            </div>

            <div class="mb-4">
                <label class="form-label" for="autor">
                    Autor
                </label>

                <input id="autor"
                       type="text"
                       class="form-control"
                       th:field="*{autor}"
                       th:errorclass="is-invalid"
                       placeholder="Nome completo do autor">

                <div class="invalid-feedback"
                     th:errors="*{autor}"></div>
            </div>

            <div class="mb-4">
                <label class="form-label" for="isbn">
                    ISBN
                </label>

                <input id="isbn"
                       type="text"
                       class="form-control"
                       th:field="*{isbn}"
                       th:errorclass="is-invalid"
                       placeholder="Ex.: 9788535914849">

                <div class="invalid-feedback"
                     th:errors="*{isbn}"></div>
            </div>

            <div class="row g-3">

                <div class="col-12 col-md-6">
                    <label class="form-label"
                           for="anoPublicacao">
                        Ano de publicação
                    </label>

                    <input id="anoPublicacao"
                           type="number"
                           class="form-control"
                           th:field="*{anoPublicacao}"
                           th:errorclass="is-invalid"
                           min="1"
                           placeholder="Ex.: 1899">

                    <div class="invalid-feedback"
                         th:errors="*{anoPublicacao}"></div>
                </div>

                <div class="col-12 col-md-6">
                    <label class="form-label"
                           for="quantidade">
                        Quantidade de exemplares
                    </label>

                    <input id="quantidade"
                           type="number"
                           class="form-control"
                           th:field="*{quantidade}"
                           th:errorclass="is-invalid"
                           min="0"
                           placeholder="Ex.: 5">

                    <div class="invalid-feedback"
                         th:errors="*{quantidade}"></div>
                </div>

            </div>

            <hr class="my-4"
                style="border-color: var(--border)">

            <div class="d-flex flex-wrap justify-content-end gap-2">
                <a th:href="@{/livros(busca=${busca})}"
                    class="btn btn-light border px-4 py-2">
                    Cancelar
                </a>

                <button type="submit"
                        class="btn btn-brand">
                    Salvar livro
                </button>
            </div>

        </form>

    </section>

</main>

</body>
</html>
